version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: job_tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ai-service:
    build: 
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: job_tracker_ai
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_tracker_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/jobtracker?schema=public
    depends_on:
      - db
      - ai-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job_tracker_frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Helps with hot-reloading on Windows inside Docker
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
